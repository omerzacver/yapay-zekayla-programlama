<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <style>
        :root {
            --bg-color: #0b120f;
            --card-bg: #121e18;
            --primary-green: #00ff66;
            --primary-hover: #00cc52;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e3328;
            --error-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: #0b120f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }

        .toggle-password:hover {
            color: var(--primary-green);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-green);
            color: #0b120f;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary-green);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Hoş Geldiniz</h1>
            <p>Devam etmek için giriş yapın</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-control" placeholder="ornek@mail.com">
                </div>
                <div class="error-message" id="emailError">Geçerli bir e-posta adresi girin.</div>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Göster</button>
                </div>
                <div class="error-message" id="passwordError">Şifre boş bırakılamaz.</div>
            </div>

            <button type="submit" class="btn">Giriş Yap</button>

            <div class="footer-links">
                <a href="forgot_password.html">Şifremi Unuttum</a>
                <a href="signup.html">Üye Ol</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                btn.textContent = "Gizle";
            } else {
                field.type = "password";
                btn.textContent = "Göster";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            
            let isValid = true;

            // Email kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim() || !emailRegex.test(email.value)) {
                emailError.style.display = 'block';
                email.style.borderColor = 'var(--error-color)';
                isValid = false;
            } else {
                emailError.style.display = 'none';
                email.style.borderColor = 'var(--border-color)';
            }

            // Şifre kontrolü
            if (!password.value.trim()) {
                passwordError.style.display = 'block';
                password.style.borderColor = 'var(--error-color)';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                password.style.borderColor = 'var(--border-color)';
            }

            if (isValid) {
                alert('Giriş başarılı!');
                // İşlem başarılı yönlendirme yapılabilir
            }
        });
    </script>
</body>
</html>
