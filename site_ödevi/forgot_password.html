<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum</title>
    <style>
        :root {
            --bg-color: #0b120f;
            --card-bg: #121e18;
            --primary-green: #00ff66;
            --primary-hover: #00cc52;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e3328;
            --error-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: #0b120f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-green);
            color: #0b120f;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary-green);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Şifremi Unuttum</h1>
            <p>E-posta adresinize sıfırlama bağlantısı göndereceğiz</p>
        </div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" class="form-control" placeholder="ornek@mail.com">
                <div class="error-message" id="emailError">Geçerli bir e-posta adresi girin.</div>
            </div>

            <button type="submit" class="btn">Şifre sıfırlama bağlantısı gönder</button>

            <div class="footer-links">
                <a href="index.html">Giriş sayfasına dön</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            let isValid = true;

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim() || !emailRegex.test(email.value)) {
                emailError.style.display = 'block';
                email.style.borderColor = 'var(--error-color)';
                isValid = false;
            } else {
                emailError.style.display = 'none';
                email.style.borderColor = 'var(--border-color)';
            }

            if (isValid) {
                alert('Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.');
            }
        });
    </script>
</body>
</html>
